<!-- ============================================================
  FW — Forma Wireframe Kit · Icon sprite + SVG pattern defs
  CANONICAL SOURCE. An identical copy of this <svg> block is
  embedded as the first child of <body> in every kit page
  (external <use href="file.svg#id"> is blocked over file://).
  After editing here, re-paste into: index.html, demos/*.html.

  Icons: 20x20 viewBox, stroke currentColor 1.5, round caps.
  Patterns: grayscale only; var() fallbacks for standalone view.
============================================================= -->
<svg xmlns="http://www.w3.org/2000/svg" class="fw-sprite" aria-hidden="true">
  <defs>
    <!-- Semantic B/W patterns (self-contained: background + ink) -->
    <pattern id="fw-pat-svg-residential" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="var(--fw-g100, #f4f4f4)"/>
      <path d="M0.5 0 V6" stroke="var(--fw-g700, #4f4f4f)" stroke-width="1"/>
    </pattern>
    <pattern id="fw-pat-svg-commercial" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="var(--fw-g100, #f4f4f4)"/>
      <circle cx="4" cy="4" r="1" fill="var(--fw-g700, #4f4f4f)"/>
    </pattern>
    <pattern id="fw-pat-svg-parking" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="var(--fw-g100, #f4f4f4)"/>
      <path d="M0.5 0 V6 M0 0.5 H6" stroke="var(--fw-g600, #6e6e6e)" stroke-width="1"/>
    </pattern>
    <pattern id="fw-pat-svg-veg" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="var(--fw-g100, #f4f4f4)"/>
      <circle cx="3" cy="3" r="0.9" fill="var(--fw-g500, #8c8c8c)"/>
    </pattern>
    <pattern id="fw-pat-svg-excluded" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="rgba(255,255,255,0.6)"/>
      <path d="M0.5 0 V8" stroke="var(--fw-g500, #8c8c8c)" stroke-width="1"/>
    </pattern>

    <!-- Mini site plan, reused by Compare panes and Board frames -->
    <symbol id="fw-site-mini" viewBox="0 0 160 112">
      <polygon points="12,18 148,10 152,94 62,104 8,84" fill="none" stroke="var(--fw-g900, #1a1a1a)" stroke-width="1.5" stroke-dasharray="5 3"/>
      <path d="M0 70 C40 64 120 92 160 84" fill="none" stroke="var(--fw-g300, #d0d0d0)" stroke-width="7"/>
      <rect x="26" y="26" width="38" height="26" fill="url(#fw-pat-svg-residential)" stroke="var(--fw-g700, #4f4f4f)"/>
      <polygon points="76,22 132,18 134,44 104,46 102,60 78,62" fill="url(#fw-pat-svg-residential)" stroke="var(--fw-g700, #4f4f4f)"/>
      <rect x="108" y="58" width="34" height="26" fill="url(#fw-pat-svg-commercial)" stroke="var(--fw-g700, #4f4f4f)"/>
      <rect x="26" y="60" width="22" height="14" fill="var(--fw-g200, #e3e3e3)" stroke="var(--fw-g400, #b0b0b0)"/>
      <circle cx="62" cy="86" r="7" fill="url(#fw-pat-svg-veg)" stroke="var(--fw-g500, #8c8c8c)"/>
      <circle cx="84" cy="92" r="5" fill="url(#fw-pat-svg-veg)" stroke="var(--fw-g500, #8c8c8c)"/>
    </symbol>
  </defs>

